{% load static %}<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Fødselsdagsfesten{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'vendor/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
  <link rel="stylesheet" href="{% static 'css/quiz.css' %}">
</head>
<body>
  {% block navbar %}
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand mb-0" href="{% url 'pages:home' %}">Martin 40</a>
      {% if user.is_authenticated %}
      <ul class="navbar-nav flex-row gap-3">
        <li class="nav-item">
          <a class="nav-link" href="{% url 'core:host_panel' %}">Quiz-vært</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'drinky:host_panel' %}">Drinky-vært</a>
        </li>
      </ul>
      {% endif %}
    </div>
  </nav>
  {% endblock %}
  {% block content %}{% endblock %}
  <script src="{% static 'vendor/htmx.min.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
